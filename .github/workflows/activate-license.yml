# Teer Puzzle — Unity license activation file (.alf)
# ----------------------------------------------------
# Sirf AIK dafa chalana hai (manual trigger) — Unity Personal
# license ke liye activation file banane ke liye.
#
# Steps:
#   1. GitHub repo → Actions tab → "Unity License Activation" → Run workflow.
#   2. Run khatam ho to Artifacts se `Unity_v6000.3.21f1.alf` download karen.
#   3. https://license.unity3d.com/manual par .alf upload karen —
#      Unity aap ko `.ulf` license file dega.
#   4. Repo → Settings → Secrets and variables → Actions → New repository secret:
#        UNITY_LICENSE  = .ulf file ka poora text (khol kar copy-paste karen)
#        UNITY_EMAIL    = Unity ID ka email
#        UNITY_PASSWORD = Unity ID ka password
#   5. Us ke baad "Build Android APK (v1.1)" workflow chal jayega.
#
# ⚠️ .ulf file ya password KABHI repo mein push na karen — sirf Secrets mein.

name: Unity License Activation

on:
  workflow_dispatch:

jobs:
  request-activation-file:
    name: Request .alf activation file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Request activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.21f1

      - name: Upload activation file (.alf)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filename }}
          path: ${{ steps.getManualLicenseFile.outputs.filename }}
